name: APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Licences Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646f7c1e2c1f1b1b1b1b1b" \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          # cmdline-tools path varie selon l'image
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager introuvable, on continue avec le SDK de l'image"
          fi

      - name: Ajouter la plateforme Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Permissions caméra (AndroidManifest)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest introuvable"
            find android -name "AndroidManifest.xml" 2>/dev/null || true
            exit 1
          fi
          if grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "Permissions déjà présentes"
          else
            PERMS='    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
            awk -v perms="$PERMS" '
              /<manifest / && !done {
                print
                print perms
                done=1
                next
              }
              { print }
            ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
            echo "Permissions injectées"
          fi
          head -n 45 "$MANIFEST"

      - name: Construire l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/FlashCabine-1.0.0-debug.apk
          ls -la release-android/

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: FlashCabine-Android
          path: release-android/*.apk
          if-no-files-found: error

      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-android/*.apk
