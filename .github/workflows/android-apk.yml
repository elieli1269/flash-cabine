name: APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Accepter licences Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Ajouter la plateforme Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Permissions caméra (AndroidManifest)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest introuvable"
            ls -la android/app/src/main/ || true
            exit 1
          fi
          if grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "Permissions déjà présentes"
          else
            # Insérer les permissions juste après la balise <manifest ...>
            PERMS='    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />'
            awk -v perms="$PERMS" '
              /<manifest / && !done {
                print
                print perms
                done=1
                next
              }
              { print }
            ' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
            echo "Permissions injectées"
          fi
          head -n 45 "$MANIFEST"

      - name: Construire l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/FlashCabine-1.0.0-debug.apk
          ls -la release-android/

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: FlashCabine-Android
          path: release-android/*.apk
          if-no-files-found: error

      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-android/*.apk
