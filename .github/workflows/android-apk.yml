name: APK Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Ajouter la plateforme Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Permissions caméra (AndroidManifest)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST" || true
            # Injecter les permissions juste après la balise <manifest ...>
            python3 - <<'PY'
import re, pathlib
p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
txt = p.read_text(encoding="utf-8")
perms = '''
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />
    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
'''
if "android.permission.CAMERA" not in txt:
    txt = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, txt, count=1)
    p.write_text(txt, encoding="utf-8")
    print("Permissions injectées")
else:
    print("Permissions déjà présentes")
PY
          fi
          cat "$MANIFEST" | head -n 40

      - name: Construire l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/FlashCabine-1.0.0-debug.apk

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: FlashCabine-Android
          path: release-android/*.apk
          if-no-files-found: error

      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-android/*.apk
