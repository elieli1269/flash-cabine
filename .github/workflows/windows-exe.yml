name: Exécutable Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  exe:
    name: Construire l'exe
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Empaqueter l'exécutable
        run: npx electron-builder --win portable nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: FlashCabine-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
